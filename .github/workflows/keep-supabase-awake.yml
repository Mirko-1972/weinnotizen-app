name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Touch Supabase keepalive table
        run: |
          response_code=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\":\"weinnotizen\",\"touched_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")

          echo "Supabase response code: $response_code"
          cat /tmp/response.txt

          if [ "$response_code" -lt 200 ] || [ "$response_code" -ge 300 ]; then
            exit 1
          fi
